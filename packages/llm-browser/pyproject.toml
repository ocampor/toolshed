[project]
name = "llm-browser"
version = "0.23.0"
description = "Playwright browser automation with declarative YAML flows for LLM agents."
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "patchright>=1.62.3,<1.63",
    "pyyaml>=6.0",
    "yaml-engine>=0.2.0",
    "lxml[html_clean]>=5.0",
]

[project.optional-dependencies]
camoufox = ["camoufox>=0.4"]
nodriver = [
    "nodriver>=0.40",
]

[project.scripts]
llm-browser = "llm_browser.cli:main"

[tool.uv]
package = true

[tool.uv.sources]
yaml-engine = { path = "../yaml-engine" }
ocampor-bench = { path = "../bench" }

[build-system]
requires = ["hatchling", "ocampor-bench[docs]>=0.1,<0.2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "cssselect>=1.5.0",
    "lxml-stubs>=0.5.1",
    "mypy>=1.19.1",
    "ocampor-bench[docs]>=0.1,<0.2",
    "pytest>=9.0.2",
    "ruff>=0.11",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_browser"]
# Written by the build hook and git-ignored, so it has to be named back in.
artifacts = ["/src/llm_browser/docs/reference/*.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
package = "llm_browser"

[tool.mypy]
strict = true

# Library source is strictly typed; the tests predate type-checking and are
# exercised by pytest, so we don't type-check them.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "yaml_engine.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "patchright.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "camoufox.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nodriver.*"
ignore_missing_imports = true
