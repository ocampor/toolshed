# Check a site is still logged in; page the owner when it is not.
params:
  - url
  - marker
  - name
steps:
  - name: open
    action: goto
    url: "{{ url }}"
    wait_until: domcontentloaded
  - name: settle
    action: think
    min_ms: 3000
    max_ms: 5000
  - name: raise tab
    action: bring_to_front
    when: { element_missing: "{{ marker }}" }
  - name: page owner
    action: notify
    when: { element_missing: "{{ marker }}" }
    message: "Login needed: {{ name }}"
    optional: true  # a dead ntfy must not cancel the wait
  - name: wait for login
    selector: "{{ marker }}"
    action: wait_for
    until: present
    timeout_ms: 1800000
    poll_ms: 5000
