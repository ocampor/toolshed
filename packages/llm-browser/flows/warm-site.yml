params:
  - url
steps:
  - name: open site
    action: goto
    url: "{{ url }}"
    wait_until: domcontentloaded
  - name: read a bit
    action: think
    min_ms: 3000
    max_ms: 8000
  - name: scroll down
    action: scroll
    delta: 500
    times: 4
  - name: follow one internal link
    action: click
    selector: "a[href^='/']:not([href='/'])"
    optional: true
    timeout: 5000
  - name: read more
    action: think
    min_ms: 4000
    max_ms: 10000
  - name: scroll again
    action: scroll
    delta: 700
    times: 3
