[project]
name = "yaml-engine"
version = "0.1.0"
description = "Generic YAML-driven engine: registry, conditions, compilation, and template substitution."
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.11.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yaml_engine"]

[tool.mypy]
strict = true

# Library source is strictly typed; the tests predate type-checking and are
# exercised by pytest, so we don't type-check them.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
