<!doctype html>
<meta charset="utf-8">
<title>Download</title>
<a id="download" class="file" href="download.txt" download="download.txt">Download</a>
<!-- Same bytes under another suggested name, so a `pick:` is visible in the result. -->
<a id="download-alternate" class="file" href="download.txt" download="alternate.txt">Download again</a>
<script>
const delay = Number(new URLSearchParams(location.search).get("delay") ?? 1500);

const recordTrust = (e) => {
  if (e.target.setAttribute) e.target.setAttribute("data-trusted", String(e.isTrusted));
};
document.addEventListener("click", recordTrust, true);
document.addEventListener("keydown", recordTrust, true);
</script>
