<!doctype html>
<meta charset="utf-8">
<title>Captcha</title>
<style>
  #captcha-image { border: 1px solid #333; background: #cfc8b0; }
  #captcha-error { color: #a00; }
</style>
<form id="captcha-form">
  <img id="captcha-image" width="120" height="40" alt="captcha"
       src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==">
  <input type="text" id="captcha-answer" autocomplete="off">
  <button type="button" id="captcha-submit">Verify</button>
</form>
<div id="captcha-error" hidden>Wrong code</div>
<div id="captcha-done" hidden>Verified</div>
<script>
  // The answer the fixture solver is expected to produce.
  const CODE = "7fkq2";
  // The banner is never cleared: a real form usually leaves the last rejection
  // on screen, and the step has to tell that apart from a fresh one.
  document.getElementById("captcha-submit").addEventListener("click", () => {
    if (document.getElementById("captcha-answer").value === CODE) {
      document.getElementById("captcha-form").remove();
      document.getElementById("captcha-done").hidden = false;
    } else {
      document.getElementById("captcha-error").hidden = false;
    }
  });
</script>
