<!doctype html>
<meta charset="utf-8">
<title>Buttons a click would miss</title>
<style>
  body { margin: 0; font: 16px/1.4 system-ui; }
  .banner {
    position: fixed; top: 0; left: 0; right: 0; height: 120px;
    background: #222; color: #fff; padding: 8px 12px;
  }
  /* Enough that only the first button's centre falls under the banner. */
  main { padding-top: 100px; }
  button { display: block; margin: 18px 12px; }
  .hack { position: relative; display: inline-block; margin: 18px 12px; }
  .over {
    position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; z-index: 1;
  }
</style>
<div class="banner">Cookie notice</div>
<main>
  <button id="buried" data-testid="buy">Buy now</button>
  <button id="off" disabled>Sold out</button>
  <button id="clear" data-testid="help">Help</button>
  <!-- Wikipedia's checkbox hack: the input is laid over the label it belongs
       to, so the label's centre hit-tests to the control it drives. One
       target, not a covered one. -->
  <div class="hack">
    <input id="agree" type="checkbox" class="over">
    <label id="tick" for="agree">I agree</label>
  </div>
  <!-- A card-sized link with its own dismiss button inside it. -->
  <a id="card" href="/missions/senior-eng-4821" data-testid="mission">
    Senior engineer
    <button>Not Interested</button>
  </a>
  <!-- Disabled by the fieldset around it, not by anything on itself. -->
  <fieldset disabled>
    <input id="in-fieldset" type="text" value="">
  </fieldset>
  <!-- A box of no size: nothing to click, and nothing to hit-test either. -->
  <a id="sizeless" href="/gone" style="display: inline-block; width: 0; height: 0"></a>
  <div style="height: 1200px"></div>
  <a id="below" href="/missions/staff-eng-991">Below the fold</a>
</main>
