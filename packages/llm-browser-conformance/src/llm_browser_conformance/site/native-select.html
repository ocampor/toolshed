<!doctype html>
<meta charset="utf-8">
<title>Native select</title>
<select id="choice"><optgroup label="Group A"><option value="a">A</option><option value="b" disabled>B</option></optgroup><optgroup label="Group B"><option value="c">C</option></optgroup></select>
<div id="result"></div>
<script>
const delay = Number(new URLSearchParams(location.search).get("delay") ?? 1500);

const recordTrust = (e) => {
  if (e.target.setAttribute) e.target.setAttribute("data-trusted", String(e.isTrusted));
};
document.addEventListener("click", recordTrust, true);
document.addEventListener("keydown", recordTrust, true);

const select = document.getElementById("choice");
select.addEventListener("change", () => {
  document.getElementById("result").textContent = select.value;
});
</script>
