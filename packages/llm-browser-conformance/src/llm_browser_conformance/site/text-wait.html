<!doctype html>
<meta charset="utf-8">
<title>Text wait</title>
<style>.gone { display: none; }</style>
<div id="status">Cargando</div>
<div class="modal"><p>Sesión iniciada</p></div>
<script>
  // A string no node ever renders: a match that read `<script>` source
  // instead of rendered text would find it.
  const buried = "Contraseña caducada";
  const delay = Number(new URLSearchParams(location.search).get("delay") ?? 1500);
  setTimeout(() => {
    document.getElementById("status").textContent = "Sesión finalizada";
    document.querySelector(".modal").classList.add("gone");
  }, delay);
</script>
