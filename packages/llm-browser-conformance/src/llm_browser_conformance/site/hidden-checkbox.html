<!doctype html>
<!-- Origin: a tax-portal invoice form, 2026-09-18: styled boxes with no label[for]. -->
<meta charset="utf-8">
<title>Hidden checkbox</title>
<div class="check">
  <input type="checkbox" id="exento" style="display:none">
  <div class="caption">Exento</div>
</div>
<div class="check">
  <input type="checkbox" id="locked" style="display:none" disabled>
  <div class="caption">Objeto de impuesto</div>
</div>
<script>
const delay = Number(new URLSearchParams(location.search).get("delay") ?? 1500);

const recordTrust = (e) => {
  if (e.target.setAttribute) e.target.setAttribute("data-trusted", String(e.isTrusted));
};
document.addEventListener("click", recordTrust, true);
document.addEventListener("keydown", recordTrust, true);
</script>
