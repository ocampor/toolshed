<!doctype html>
<meta charset="utf-8">
<title>Shadow DOM</title>
<div id="host"></div>
<div id="result"></div>
<script>
const delay = Number(new URLSearchParams(location.search).get("delay") ?? 1500);

const recordTrust = (e) => {
  if (e.target.setAttribute) e.target.setAttribute("data-trusted", String(e.isTrusted));
};
document.addEventListener("click", recordTrust, true);
document.addEventListener("keydown", recordTrust, true);

const root = document.getElementById("host").attachShadow({ mode: "open" });
root.innerHTML = '<input id="shadow-input"><button id="shadow-btn">Send</button>';
root.getElementById("shadow-btn").addEventListener("click", () => {
  document.getElementById("result").textContent = root.getElementById("shadow-input").value;
});
</script>
