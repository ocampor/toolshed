# Tab moves focus, Enter submits from wherever focus landed, Escape closes.
steps:
  - name: focus-first
    action: click
    selector: "#first"
  - name: tab
    action: press
    selector: "#first"
    key: Tab
  - name: enter
    action: press
    key: Enter
  - name: result
    action: read
    selector: "#result"
    extract:
      text:
        attribute: textContent
  - name: escape
    action: press
    key: Escape
  - name: wait-modal-gone
    action: wait_for
    selector: "#modal"
    state: detached
    timeout: 5000
    interval: 200
