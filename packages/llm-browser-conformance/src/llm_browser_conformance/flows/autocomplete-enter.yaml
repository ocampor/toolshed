# Same list, chosen with the keyboard instead of the mouse.
steps:
  - name: type
    action: type
    selector: "#search"
    value: al
    delay: 20
  - name: wait-options
    action: wait_for
    selector: ".option"
    state: attached
    timeout: 8000
    interval: 200
  - name: enter
    action: press
    selector: "#search"
    key: Enter
  - name: result
    action: read
    selector: "#result"
    extract:
      text:
        attribute: textContent
