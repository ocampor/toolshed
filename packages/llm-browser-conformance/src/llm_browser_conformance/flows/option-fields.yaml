# `option-plain` plus `fields:` and `read:` blocks, which validate and are
# then ignored.
steps:
  - name: gated
    action: read
    selector: "#present"
    fields:
      - name: text
        selector: "#absent"
        attribute: nonsense
    read:
      text:
        selector: "#absent"
        attribute: nonsense
    extract:
      text:
        attribute: textContent
