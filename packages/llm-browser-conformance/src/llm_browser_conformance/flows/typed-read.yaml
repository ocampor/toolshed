# `read` fields typed in the flow: `pattern` picks the value out of the text,
# `type` converts it, and `required` marks the row a value went missing from.
steps:
  - name: cards
    action: read
    selector: ".card"
    extract:
      price: { child_selector: ".price", pattern: '([\d,]+)', type: int, required: true }
      lot: { child_selector: ".features", pattern: '\d+ m²' }
      bedrooms: { child_selector: ".features", pattern: '(\d+) rec', type: int }
      rating: { child_selector: ".rating", type: float }
      units: { child_selector: ".units", type: int }
