# Every output kind in one flow: read rows, a dom string, and a screenshot's
# bytes — all of them in `outputs`, none of them a path.
steps:
  - name: rows
    action: read
    selector: "#list li"
    extract:
      code:
        attribute: data-code
      label:
        attribute: data-label
  - name: panel
    action: dom
    selector: "#panel"
  - name: shot
    action: screenshot
