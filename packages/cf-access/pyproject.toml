[project]
name = "cf-access"
version = "0.1.0"
description = "Cloudflare Access JWT validation middleware for Starlette/MCP origins."
requires-python = ">=3.13"
dependencies = [
    "pyjwt[crypto]>=2.8",
    "starlette>=0.40",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27",  # starlette.testclient.TestClient backend
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cf_access"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
